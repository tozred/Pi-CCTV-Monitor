# One large view plus small ones around it, using exact pixel positions.
#
#   +-------+-------+-------+-------+
#   |   1   |   2   |   3   |   4   |   <- small, top row
#   +-------+-------+-------+-------+
#   |                       |   5   |
#   |      7  (large)       +-------+
#   |                       |   6   |
#   +-----------------------+-------+
#
# WINDOW_POSITIONS overrides GRID_COLS / GRID_ROWS entirely.
# Format per slot: "X Y WIDTH HEIGHT" in pixels. Cameras fill the slots
# in order, so CAMERAS[6] (the 7th) lands in the large slot below.

CAMERAS=(
    "rtsp://admin:password@192.168.1.10:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.11:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.12:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.13:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.14:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.15:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.16:554/Streaming/Channels/101"
)
CAMERA_NAMES=(
    "Entrance" "Corridor" "Store" "Stairs" "Loading" "Bar" "Reception"
)

SCREEN_WIDTH=1280
SCREEN_HEIGHT=720

WINDOW_POSITIONS=(
    "0    0    320 180"    # 1 top row
    "320  0    320 180"    # 2 top row
    "640  0    320 180"    # 3 top row
    "960  0    320 180"    # 4 top row
    "960  180  320 270"    # 5 right column
    "960  450  320 270"    # 6 right column
    "0    180  960 540"    # 7 the large view (16:9)
)

ROTATION_INTERVAL=0
