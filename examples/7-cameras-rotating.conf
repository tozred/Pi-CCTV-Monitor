# More cameras than tiles: PiMonitor splits them into pages and cycles.
# 7 cameras in a 2x2 grid = 2 pages (4 + 3), swapping every 30 seconds.

CAMERAS=(
    "rtsp://admin:password@192.168.1.10:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.11:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.12:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.13:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.14:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.15:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.16:554/Streaming/Channels/102"
)
CAMERA_NAMES=(
    "Front Door" "Backyard" "Garage" "Driveway"
    "Side Gate" "Porch" "Shed"
)

GRID_COLS=2
GRID_ROWS=2
WINDOW_GAP=4

# Seconds per page. 0 disables rotation and only page 1 is shown.
ROTATION_INTERVAL=30

# "no"  = carry on from the page that was showing before a restart
# "yes" = always start again at page 1
ROTATION_ON_START="no"
