# 6 cameras filling a 16:9 screen with no wasted space.
# This is the layout used on a live hotel back office wall.
#
# A 3x3 grid would leave a black band at the bottom with only 6 cameras,
# so 3x2 is the right choice: 6 tiles, screen full, correct aspect ratio.

CAMERAS=(
    "rtsp://admin:password@192.168.1.10:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.11:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.12:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.13:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.14:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.15:554/Streaming/Channels/102"
)
CAMERA_NAMES=( "Entrance" "Lobby" "Bar" "Corridor" "Terrace" "Car Park" )

SCREEN_WIDTH=1920
SCREEN_HEIGHT=1080

GRID_COLS=3
GRID_ROWS=2
WINDOW_GAP=4
ROTATION_INTERVAL=0

# Software decoding. See docs/TROUBLESHOOTING.md: the Pi hardware decoder
# is broken on some kernels and produces black or blue tiles.
HWDEC="none"
