# The classic quad view: 4 cameras in a 2x2 grid.
# Use SUB streams: each tile is only a quarter of the screen, so a full
# resolution stream would be scaled down anyway and just waste CPU.

CAMERAS=(
    "rtsp://admin:password@192.168.1.10:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.11:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.12:554/Streaming/Channels/102"
    "rtsp://admin:password@192.168.1.13:554/Streaming/Channels/102"
)
CAMERA_NAMES=( "Front Door" "Backyard" "Garage" "Driveway" )

GRID_COLS=2
GRID_ROWS=2
WINDOW_GAP=4
ROTATION_INTERVAL=0
